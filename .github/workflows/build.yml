name: Scheduled rebuild

# Triggers:
#   - push to main (only when source files change; the bot's own demo.html /
#     data commits use the default GITHUB_TOKEN and do NOT re-trigger workflows,
#     so there's no infinite-loop risk here)
#   - daily 08:00 UTC cron (~09:00 London BST) picks up the previous day's
#     yfinance closes for the demo build.
#   - manual button via the Actions tab
#
# IMPORTANT: this workflow only rebuilds the standalone `demo.html` (built
# from transactions.csv). It deliberately does NOT touch docs/index.html —
# that file is rebuilt locally from log.xlsx by the author and pushed when
# they want to refresh the public site. Without this guard, CI would
# overwrite the real-data dashboard with sample-data on every cron run.
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'requirements.txt'
      - 'transactions.csv'
      - 'watchlist.csv'
      - 'universe.csv'
      - '.github/workflows/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild demo.html (standalone, self-contained)
        run: python build.py --demo

      - name: Commit & push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo.html data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Demo rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
