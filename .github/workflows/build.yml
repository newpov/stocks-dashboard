name: Scheduled rebuild

# Triggers:
#   - push to main (only when source files change; the bot's own demo.html /
#     data commits use the default GITHUB_TOKEN and do NOT re-trigger workflows,
#     so there's no infinite-loop risk here)
#   - daily 08:00 UTC cron (~09:00 London BST) picks up the previous day's
#     yfinance closes for the demo build.
#   - manual button via the Actions tab
#
# IMPORTANT: this workflow rebuilds BOTH the standalone `demo.html` (from
# transactions.csv) AND the real `docs/index.html` (from the committed,
# privacy-safe `basket.snapshot.csv` — never from log.xlsx, which stays local).
# The docs build is gated by the privacy guard + sanity checks below; if either
# fails the job stops before committing, so the last-good published page stays
# live. The author regenerates basket.snapshot.csv locally (from log.xlsx) when
# they trade and commits just that file; CI does the daily market-data refresh.
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'requirements.txt'
      - 'transactions.csv'
      - 'basket.snapshot.csv'
      - 'watchlist.csv'
      - 'universe.csv'
      - '.github/workflows/**'
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild demo.html (standalone, self-contained)
        run: python build.py --demo

      - name: Rebuild docs/index.html from committed snapshot
        run: python build.py --from-snapshot

      - name: Sanity + privacy gate (skips publish on failure)
        run: python sanity_check.py

      - name: Commit & push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs demo.html data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
