name: Scheduled rebuild

# Triggers:
#   - push to main (only when source files change; the bot's own demo.html /
#     data commits use the default GITHUB_TOKEN and do NOT re-trigger workflows,
#     so there's no infinite-loop risk here)
#   - daily 22:00 UTC cron runs AFTER the US close (20:00 UTC summer /
#     21:00 UTC winter) so the latest yfinance bar is a fully SETTLED session
#     for both London and US. An earlier (e.g. 08:00 UTC) run would stamp a
#     same-day row the moment London opens while the US session is still
#     pending, mislabelling an intraday bar as the "last close".
#   - manual button via the Actions tab
#
# IMPORTANT: this workflow rebuilds BOTH the standalone `demo.html` (from
# transactions.csv) AND the real `docs/index.html` (from the committed,
# privacy-safe `basket.snapshot.csv` — never from log.xlsx, which stays local).
# The docs build is gated by the privacy guard + sanity checks below; if either
# fails the job stops before committing, so the last-good published page stays
# live. The author regenerates basket.snapshot.csv locally (from log.xlsx) when
# they trade and commits just that file; CI does the daily market-data refresh.
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'requirements.txt'
      - 'requirements-ci.txt'
      - 'transactions.csv'
      - 'basket.snapshot.csv'
      - 'watchlist.csv'
      - 'universe.csv'
      - 'predictions.csv'
      - 'assets/**'
      - '.github/workflows/**'
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# One rebuild at a time: a push-triggered run and the nightly cron could
# otherwise both build and race to push (the loser fails non-fast-forward).
# Queue rather than cancel, so a running publish always finishes.
concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Actions pinned to commit SHAs (a tag can be moved; a SHA cannot).
      # persist-credentials: false keeps the write token OUT of .git/config, so
      # the build steps -- which run third-party packages -- can't read it; only
      # the final push step receives it (v3.8.4).
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # Exact versions + sha256 hashes for every package (generated from
      # requirements-ci.in; see that file). A new or tampered release can't
      # slip into the nightly build unnoticed.
      - name: Install dependencies (hashed lock)
        run: pip install --require-hashes -r requirements-ci.txt

      - name: Rebuild demo.html (standalone, self-contained)
        run: python build.py --demo

      - name: Rebuild docs/index.html from committed snapshot
        run: python build.py --from-snapshot

      - name: Sanity + privacy gate (skips publish on failure)
        run: python sanity_check.py

      - name: Commit & push if anything changed
        if: ${{ success() }}   # explicit: never publish if the gate (or any prior step) failed
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # the only step that gets the token
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs demo.html data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily rebuild $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
